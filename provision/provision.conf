# Settings for provision-onn.sh (the command-line alternative to the setup app).
# Copy to provision.local.conf and edit; provision.local.conf is git-ignored.

# Your Dispatcharr server, e.g. http://192.168.1.10:9191
DISPATCHARR_URL=""
M3U_URL="${DISPATCHARR_URL:+$DISPATCHARR_URL/output/m3u}"
EPG_URL="${DISPATCHARR_URL:+$DISPATCHARR_URL/output/epg}"
# Optional: URL of a launcher-config.json the box re-reads on every start (see server/).
CONFIG_URL=""
# Optional: IANA time zone for the box, e.g. America/New_York
TIMEZONE=""

LAUNCHER_PKG="tv.vanilla.launcher"
LIVETV_PKG="tv.vanilla.live"

APKS=(
  "apks/vanilla-launcher.apk"
  "apks/vanilla-livetv.apk"
)

# Packages offered for removal live in ../setup/bloat.txt (shared with the setup app).
mapfile -t BLOAT < <(sed -e 's/#.*//' -e 's/|.*//' -e 's/[[:space:]]//g' ../setup/bloat.txt | grep -v '^$')
